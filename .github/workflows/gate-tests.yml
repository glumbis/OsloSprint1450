name: Merge gate tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    name: Merge gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: node .github/tests/review-merge.cjs
